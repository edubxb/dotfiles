version = 4
final_space = true
pwd = 'osc7'
streaming = 100

[upgrade]
  source = 'cdn'
  interval = '168h'
  auto = false
  notice = false

[transient_prompt]
  template = '<b><r>  {{ now | date "15:04:05" }}</r></b> '
  foreground = 'white'
  newline = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    template = "{{ if gt .Code 0 }} │\n └─<b><r>{{ .Code }}{{ if eq .Code 130 }} Ctrl+C{{ end }}</r></b>{{ end }}"
    foreground = 'red'
    type = 'exit'
    style = 'plain'

  [[blocks.segments]]
    template = "{{ if eq .Code 0 }} │\n └─{{ else }}<red,white> </>{{ end }}<b><r>󰅒 {{ .FormattedMs }}</r></b>"
    foreground = 'white'
    type = 'executiontime'
    style = 'plain'

    [blocks.segments.options]
      threshold = 30001.0

  [[blocks.segments]]
    template = '{{ if gt .Code 0 }}{{ if not (.Segments.Contains "Executiontime") }}{{ end }}{{ end }}'
    foreground = 'red'
    type = 'text'
    style = 'plain'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true
  force = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '▍'
    foreground = 'white'
    type = 'text'
    style = 'plain'

  [[blocks.segments]]
    template = '{{ if .SSHSession }}{{ .UserName }}@{{ .HostName }}{{ end }} '
    foreground = 'lightBlue'
    type = 'session'
    style = 'plain'

  [[blocks.segments]]
    template = '{{ if .IsWorkTree }} {{ end }}<b><d>{{ .HEAD }}</d></b>{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if .Staging.Changed }} <r><b> {{ .Staging.String }} </b></r>{{ end }}{{ if gt .StashCount 0}}  {{ .StashCount }}{{ end }}{{ if gt .WorktreeCount 0}}  {{ .WorktreeCount }}{{end}} '
    foreground = 'white'
    type = 'git'
    style = 'plain'

    [blocks.segments.options]
      branch_ahead_icon = '󰁝'
      branch_behind_icon = '󰁅'
      branch_gone_icon = ''
      branch_icon = ' '
      branch_identical_icon = ''
      commit_icon = ''
      fetch_stash_count = true
      fetch_status = true
      tag_icon = ' '

  [[blocks.segments]]
    template = '{{ if .Segments.Git.Dir }}<b>{{ .Segments.Git.RepoName }}<d>{{ .PWD | replace .Segments.Git.Dir "" }} </d></b>{{ else }}<b>{{ .PWD }}</b>{{ end }}'
    foreground = 'white'
    type = 'path'
    style = 'plain'

  [[blocks.segments]]
    template = '{{ if eq .Env.POSH_GIT_HOOKS_MISSING "true" }}󰛣{{ end }}'
    foreground = 'red'
    type = 'text'
    style = 'plain'

[[blocks]]
  type = 'prompt'
  alignment = 'right'

  [[blocks.segments]]
    template = ' <b>󰏗  {{ .Name }}{{ if .Error }}{{ .Error }}{{ else }}{{ if .Version }}:{{.Version}}{{ end }}{{ end }}</b>'
    foreground = 'yellow'
    type = 'project'
    style = 'plain'

  [[blocks.segments]]
    template = ' <b>󰇧  {{ .WorkspaceName }}{{ if .Version }}{{ .Version }}{{ end }}</b>'
    foreground = 'yellow'
    type = 'terraform'
    style = 'plain'

    [blocks.segments.options]
      fetch_version = true

  [[blocks.segments]]
    template = ' <b>󰌠  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}</b>'
    foreground = 'green'
    type = 'python'
    style = 'plain'

    [blocks.segments.options]
      display_mode = 'context'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '▍'
    foreground = 'white'
    type = 'text'
    style = 'plain'

  [[blocks.segments]]
    template = '{{ if gt .Jobs 0 }}{{ .Jobs }} 󱤷 {{ end }}'
    foreground = 'white'
    type = 'text'
    style = 'plain'

  [[blocks.segments]]
    template = ''
    foreground = 'white'
    type = 'text'
    style = 'plain'

[[tooltips]]
  template = '󱃾  <i>{{ .Context }}{{ if .Namespace }} :: {{ .Namespace }}{{ end }}</i>'
  foreground = '#3382e3'
  type = 'kubectl'
  style = 'plain'
  tips = ['kube', 'kubectl', 'kubenctx', 'argocd']

[[tooltips]]
  template = '    {{ .Output }}'
  foreground = '#ee8671'
  type = 'command'
  style = 'plain'
  tips = ['argocd']

  [tooltips.properties]
    shell = 'sh'
    interpret = false
    command = 'argocd context | sed -nr "/\*/ s/^\*.* ([^ ]+) .*/\1/p"'

[[tooltips]]
  template = '{{ if and .Env.AWS_PROFILE (not .Env.AWS_ACCESS_KEY_ID) }}󰅟  <i>{{ .Env.AWS_PROFILE }}{{ with .Env.POSH_AWS_SSO_LEFT }} ({{ . }}){{ end }}{{ if .Region }} :: {{ .Region }}{{ end }}</i>{{ end }}'
  foreground = '#FF9901'
  type = 'aws'
  style = 'plain'
  tips = ['aws']

  [tooltips.properties]
    display_default = true

[[tooltips]]
  template = '{{ if or .Env.AWS_ACCESS_KEY_ID (not .Env.AWS_PROFILE) }}󰅟  <i>{{ if .Env.AWS_ACCESS_KEY_ID }}env keys{{ else }}no profile{{ end }}{{ if .Env.AWS_REGION }} :: {{ .Env.AWS_REGION }}{{ else if .Env.AWS_DEFAULT_REGION }} :: {{ .Env.AWS_DEFAULT_REGION }}{{ end }}</i>{{ end }}'
  foreground = '#FF9901'
  type = 'text'
  style = 'plain'
  tips = ['aws']

[[tooltips]]
  template = '󰅟  <i>{{ if .ActiveConfig }}{{ .ActiveConfig }}{{ end }}{{ if .Project }} :: {{ .Project }}{{ end }}{{ if .Region }}/{{ .Region }}{{ end }}</i>'
  foreground = '#2A73E8'
  type = 'gcp'
  style = 'plain'
  tips = ['gcloud', 'gsutil']
