[settings]
env_shell_expand = true
experimental = true
idiomatic_version_file_enable_tools = []
minimum_release_age = "7d"

[settings.npm]
package_manager = "pnpm"

[tools]
"aqua:lusingander/serie" = "latest"
"cargo:lumen" = "latest"
"cargo:tsowell/wiremix" = "latest"
"github:EdJoPaTo/mqttui" = "latest"
"github:Gentleman-Programming/engram" = "latest"
"github:abhinav/git-spice" = "latest"
"github:agavra/tuicr" = "latest"
"github:akitaonrails/ai-jail" = "latest"
"github:alltuner/mise-completions-sync" = "latest"
"github:altsem/gitu" = "latest"
"github:bitwarden/clients" = "cli"
"github:control-theory/gonzo" = "latest"
"github:danielmiessler/fabric" = "latest"
"github:dlvhdr/diffnav" = "latest"
"github:dlvhdr/gh-enhance" = "latest"
"github:gentleman-programming/engram" = "latest"
"github:graykode/abtop" = "latest"
"github:homeport/dyff" = "latest"
"github:homeport/termshot" = "latest"
"github:kovidgoyal/kitty" = { version = "latest", asset_pattern = "kitty-*-x86_64.txz" }
"github:kyu08/fzf-make" = "latest"
"github:lhvy/pipes-rs" = { version = "latest", bin_path = "target/x86_64-unknown-linux-gnu/release" }
"github:max-sixty/worktrunk" = "latest"
"github:mbrt/gmailctl" = "latest"
"github:mexirica/aptui" = "latest"
"github:nolabs-ai/nono" = "latest"
"github:rivolink/leaf" = "latest"
"github:rtk-ai/rtk" = "latest"
"github:samwho/spacer" = "latest"
"github:skyscanner/turbolift" = "latest"
"github:sorairolake/qrtool" = "latest"
"github:vi/websocat" = "latest"
"go:github.com/maaslalani/confetty" = "latest"
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
"npm:hunkdiff" = "latest"
"pipx:mitmproxy" = "latest"
"pipx:piptree" = "latest"
"pipx:poetry" = "latest"
"pipx:rexi" = "latest"
"pipx:sqlit-tui" = { version = "latest", uvx_args = "--with 'paramiko<4.0.0' --with sshtunnel --with psycopg2-binary" }
ast-grep = "latest"
atuin = "latest"
bun = "latest"
deno = "latest"
difftastic = "latest"
doggo = "latest"
fnox = "latest"
fx = "latest"
gh = "latest"
jnv = "latest"
miller = "latest"
navi = "latest"
neovim = "latest"
oh-my-posh = "latest"
playwright = "latest"
pnpm = "latest"
rust = "latest"
usage = "latest"
uv = "latest"
wtfutil = "latest"
yazi = "latest"

[shell_alias]
fireworks ="confetty fireworks"
pipes = "pipes-rs -b true -c rgb -k curved -p 25"

[hooks]
postinstall = "misecompsync"
