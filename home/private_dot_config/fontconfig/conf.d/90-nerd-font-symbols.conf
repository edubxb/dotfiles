<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <alias>
        <family>monospace</family>
        <accept>
            <family>Symbols Nerd Font Mono</family>
            <family>FontAwesome</family>
            <family>Material Design Icons version 6</family>
            <family>Material Design Icons version 5</family>
            <family>Weather Icons</family>
        </accept>
    </alias>
    <alias>
        <family>sans-serif</family>
        <accept>
            <family>Symbols Nerd Font</family>
            <family>FontAwesome</family>
            <family>Material Design Icons version 6</family>
            <family>Material Design Icons version 5</family>
            <family>Weather Icons</family>
        </accept>
    </alias>
    <alias>
        <family>serif</family>
        <accept>
            <family>Symbols Nerd Font</family>
            <family>FontAwesome</family>
            <family>Material Design Icons version 6</family>
            <family>Material Design Icons version 5</family>
            <family>Weather Icons</family>
        </accept>
    </alias>
</fontconfig>
